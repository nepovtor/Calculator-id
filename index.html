<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IP Practice Menu</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .menu {
            display: flex;
            gap: 20px;
        }
        .card {
            flex: 1;
            max-width: 350px;
            background-color: rgba(51, 51, 51, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
            text-align: center;
        }
        .card h2 {
            color: #00BCD4;
            margin-bottom: 15px;
            font-size: 24px;
        }
        .card p {
            margin-bottom: 20px;
            line-height: 1.4;
        }
        .card a {
            display: inline-block;
            background-color: #00BCD4;
            color: white;
            text-decoration: none;
            padding: 12px 20px;
            font-size: 18px;
            border-radius: 8px;
            transition: background-color 0.3s ease;
        }
        .card a:hover {
            background-color: #0097a7;
        }
    </style>
</head>
<body>
    <div class="menu">
        <div class="card">
            <h2>Калькулятор ID</h2>
            <p>Вычисляй параметры подсети для любого IP/CIDR.</p>
            <a href="calculator.html">Открыть</a>
        </div>
        <div class="card">
            <h2>Тест знаний</h2>
            <p>Попробуй сам проверить свои знания. Возьми листик бумаги и ручку и посчитай.</p>
            <a href="training.html">Начать</a>
        </div>
    </div>
</body>
</html>
