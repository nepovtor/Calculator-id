<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subnet Training</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .container {
            max-width: 800px;
            background-color: rgba(51, 51, 51, 0.85);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.4);
        }
        h1 {
            text-align: center;
            color: #00BCD4;
            margin-bottom: 30px;
            font-size: 28px;
        }
        label {
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 10px;
            display: block;
        }
        input {
            padding: 12px;
            margin-bottom: 20px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid #00BCD4;
            background-color: #2c2c2c;
            color: white;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        button {
            background-color: #00BCD4;
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 20px;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #0097a7;
        }
        .highlight {
            color: #00BCD4;
            font-weight: bold;
        }
        #congrats {
            text-align: center;
            margin-top: 10px;
            font-size: 20px;
            display: none;
            color: #00BCD4;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Subnet Training</h1>
        <p>Solve for IP: <span id="randomIP" class="highlight"></span></p>
        <label for="step1">1. IP address in binary:</label>
        <input type="text" id="step1" placeholder="00000000.00000000.00000000.00000000">
        <label for="step2">2. Subnet mask:</label>
        <input type="text" id="step2" placeholder="255.255.255.0">
        <label for="step3">3. Network address:</label>
        <input type="text" id="step3" placeholder="192.168.0.0">
        <label for="step4">4. Broadcast address:</label>
        <input type="text" id="step4" placeholder="192.168.0.255">
        <label for="step5">5. Host range:</label>
        <input type="text" id="step5" placeholder="192.168.0.1 - 192.168.0.254">
        <button onclick="checkAnswers()">Check Answers</button>
        <button onclick="generateChallenge()">New IP</button>
        <div id="congrats" class="highlight"></div>
    </div>
    <script src="training.js"></script>
</body>
</html>
